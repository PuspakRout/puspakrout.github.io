<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>100% Client-Side Markdown Converter</title>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col p-6">

    <header class="max-w-4xl w-full mx-auto text-center my-6">
        <h1 class="text-3xl font-black text-indigo-600">Client-Side MarkItDown Converter</h1>
        <p class="text-slate-500 text-sm mt-1">Zero Servers. Zero Uploads. Processed 100% inside your sandbox.</p>
    </header>

    <main class="max-w-4xl w-full mx-auto flex-1 flex flex-col gap-4">
        <div id="drop-zone" style="opacity: 0.4; pointer-events: none;" class="border-2 border-dashed border-slate-300 bg-white rounded-xl p-8 text-center cursor-pointer transition-all flex flex-col items-center justify-center">
            <input type="file" id="file-input" class="hidden">
            <span class="text-4xl">📄</span>
            <p class="text-md font-semibold text-slate-700 mt-2">Drop document file here, or click to browse</p>
        </div>

        <div id="status-bar" class="text-center py-2 font-semibold text-indigo-600 animate-pulse">
            Booting system runtime...
        </div>

        <div id="output-area" class="hidden flex-1 flex flex-col gap-2">
            <textarea id="markdown-preview" readonly class="w-full min-h-[350px] font-mono text-sm bg-white p-4 border border-slate-200 rounded-lg focus:outline-none shadow-inner"></textarea>
        </div>
    </main>

    <script type="module" src="main.js"></script>
</body>
</html>
